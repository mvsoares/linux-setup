# Theme 64: VS Code Dark
# swatch256: 31 236 79
format="HOST PWD GIT PYENV TF KUBE"
separator_char=$'\uE0B0'
enable_vertical_padding=true
enable_command_on_new_line=false

font_color_host="white"
background_host="31"

font_color_pwd="white"
background_pwd="236"

font_color_git="black"
background_git="79"

font_color_pyenv="black"
background_pyenv="187"

font_color_tf="black"
background_tf="215"

font_color_kube="white"
background_kube="133"

font_color_input="79"
background_input="none"
