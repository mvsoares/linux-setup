# Theme 63: Cyberpunk Edgerunners
# swatch256: 226 51 234
format="HOST PWD GIT PYENV TF KUBE"
separator_char=$'\uE0B4'
separator_char_end=$'\uE0B0'
enable_vertical_padding=true
enable_command_on_new_line=true

font_color_host="black"
background_host="226"

font_color_pwd="black"
background_pwd="51"

font_color_git="white"
background_git="234"

font_color_pyenv="white"
background_pyenv="198"

font_color_tf="black"
background_tf="82"

font_color_kube="white"
background_kube="129"

font_color_input="226"
background_input="none"
