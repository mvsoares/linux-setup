<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerd Fonts Preview</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #2a2a3d;
      --surface2: #313147;
      --border: #3a3a5c;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --purple: #cba6f7;
      --red: #f38ba8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 1.6rem;
    }

    .title-block h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .title-block .subtitle {
      color: var(--subtext);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ctrl-group label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--subtext);
    }

    .ctrl-group label.editor-label { color: var(--accent); }
    .ctrl-group label.tab-label    { color: var(--purple); }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .font-badge {
      font-size: 0.75rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      min-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .font-badge.editor { border-color: var(--accent); color: var(--accent); }
    .font-badge.tab    { border-color: var(--purple); color: var(--purple); }

    .spinner-wrap {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .spinner-wrap.editor { border-color: var(--accent); }
    .spinner-wrap.tab    { border-color: var(--purple); }

    .spinner-val {
      width: 42px;
      background: var(--surface2);
      color: var(--text);
      border: none;
      text-align: center;
      font-size: 0.82rem;
      padding: 4px 2px;
      outline: none;
    }

    .spin-btn {
      background: var(--surface2);
      border: none;
      color: var(--subtext);
      width: 22px;
      height: 28px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.1s, color 0.1s;
    }

    .spin-btn:hover { background: var(--border); color: var(--text); }
    .spinner-wrap.editor .spin-btn:hover { color: var(--accent); }
    .spinner-wrap.tab    .spin-btn:hover { color: var(--purple); }

    /* ── Status ── */
    #status {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--subtext);
      transition: color 0.3s;
      white-space: nowrap;
    }
    #status.ok  { color: var(--green); }
    #status.err { color: var(--red); }

    /* ── Terminal Settings panel ── */
    .settings-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--subtext);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .settings-toggle:hover { color: var(--text); border-color: var(--accent); }
    .settings-toggle.open  { color: var(--accent); border-color: var(--accent); }

    .settings-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 1.4rem;
      overflow: hidden;
    }
    .settings-panel.open { display: block; }

    .settings-tabs {
      display: flex;
      flex-wrap: wrap;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .settings-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--subtext);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .settings-tab:hover  { color: var(--text); }
    .settings-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .settings-content { padding: 1.1rem 1.4rem; }

    .settings-pane { display: none; flex-direction: column; gap: 12px; max-width: 420px; }
    .settings-pane.active { display: flex; }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.8rem;
    }
    .settings-row label { color: var(--subtext); }
    .settings-row select,
    .settings-row input[type="number"],
    .settings-row input[type="text"] {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.78rem;
      width: 150px;
    }
    .settings-row input[type="range"] { width: 120px; }
    .settings-row .val { color: var(--text); font-size: 0.74rem; min-width: 40px; text-align: right; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.15s, border-color 0.15s;
    }
    .switch .slider::before {
      content: '';
      position: absolute;
      height: 14px; width: 14px;
      left: 2px; top: 2px;
      background: var(--subtext);
      border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
    }
    .switch input:checked + .slider { background: rgba(137, 180, 250, 0.25); border-color: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(14px); background: var(--accent); }

    .scheme-row { display: flex; gap: 6px; }
    .scheme-row input { flex: 1; width: auto; }
    .scheme-row button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--subtext);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.74rem;
      cursor: pointer;
    }
    .scheme-row button:hover { color: var(--accent); border-color: var(--accent); }

    .scheme-quick { display: flex; flex-wrap: wrap; gap: 6px; }
    .scheme-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--subtext);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .scheme-chip:hover   { color: var(--accent); border-color: var(--accent); }
    .scheme-chip.active  { color: var(--bg); background: var(--accent); border-color: var(--accent); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 1.2rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.3rem 2.4rem;
      position: relative;
      transition: border-color 0.15s, transform 0.1s;
    }

    .card:hover { transform: translateY(-1px); }

    .card.active-editor { border-color: var(--accent); background: #252538; }
    .card.active-tab    { border-top: 2px solid var(--purple); }
    .card.active-editor.active-tab { border-color: var(--accent); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .font-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      transition: color 0.2s;
    }

    .card.active-editor .font-name { color: var(--accent); }

    .badges { display: flex; gap: 0.35rem; align-items: center; }

    .font-tag {
      font-size: 0.67rem;
      color: var(--subtext);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .badge {
      font-size: 0.62rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 6px;
      display: none;
    }

    .badge-editor { background: var(--accent);  color: var(--bg); }
    .badge-tab    { background: var(--purple);   color: var(--bg); }

    .card.active-editor .badge-editor { display: inline; }
    .card.active-tab    .badge-tab    { display: inline; }

    .sample    { font-size: 14px; line-height: 1.65; color: var(--text); }
    .code-line { color: var(--yellow); font-size: 13px; margin-top: 0.5rem; opacity: 0.85; }
    .icons     { font-size: 18px; margin-top: 0.5rem; color: var(--green); letter-spacing: 0.15em; }

    /* ── Card action buttons ── */
    .card-actions {
      position: absolute;
      bottom: 0.65rem;
      right: 0.9rem;
      display: flex;
      gap: 0.4rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .card-actions,
    .card.active-editor .card-actions,
    .card.active-tab .card-actions { opacity: 1; }

    .act-btn {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 4px;
      padding: 3px 9px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .act-btn:hover { opacity: 0.8; }

    .act-btn.editor { background: var(--accent);  color: var(--bg); }
    .act-btn.tab    { background: var(--purple);  color: var(--bg); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title-block">
      <h1>Font Preview</h1>
      <div class="subtitle">Installed monospace &amp; Nerd fonts — click to apply to WezTerm</div>
    </div>

    <div class="controls">
      <!-- Editor font + size -->
      <div class="ctrl-group">
        <label class="editor-label">Editor Font</label>
        <div class="ctrl-row">
          <div class="font-badge editor" id="badge-editor">—</div>
          <select class="spinner-val" id="editor-weight" style="width: auto; padding: 4px; border: 1px solid var(--border); border-radius: 6px;">
            <option value="Thin">Thin</option>
            <option value="ExtraLight">ExtraLight</option>
            <option value="Light">Light</option>
            <option value="Regular" selected>Regular</option>
            <option value="Medium">Medium</option>
            <option value="SemiBold">SemiBold</option>
            <option value="Bold">Bold</option>
            <option value="ExtraBold">ExtraBold</option>
            <option value="Black">Black</option>
          </select>
          <div class="spinner-wrap editor">
            <button class="spin-btn" id="editor-dec">−</button>
            <input  class="spinner-val" id="editor-size" type="text" value="14" readonly>
            <button class="spin-btn" id="editor-inc">+</button>
          </div>
        </div>
      </div>

      <!-- Tab font + size -->
      <div class="ctrl-group">
        <label class="tab-label">Tab Font</label>
        <div class="ctrl-row">
          <div class="font-badge tab" id="badge-tab">—</div>
          <select class="spinner-val" id="tab-weight" style="width: auto; padding: 4px; border: 1px solid var(--border); border-radius: 6px;">
            <option value="Thin">Thin</option>
            <option value="ExtraLight">ExtraLight</option>
            <option value="Light">Light</option>
            <option value="Regular" selected>Regular</option>
            <option value="Medium">Medium</option>
            <option value="SemiBold">SemiBold</option>
            <option value="Bold">Bold</option>
            <option value="ExtraBold">ExtraBold</option>
            <option value="Black">Black</option>
          </select>
          <div class="spinner-wrap tab">
            <button class="spin-btn" id="tab-dec">−</button>
            <input  class="spinner-val" id="tab-size" type="text" value="12.5" readonly>
            <button class="spin-btn" id="tab-inc">+</button>
          </div>
        </div>
      </div>
    </div>

    <button class="settings-toggle" id="settings-toggle"><span>⚙</span> Terminal Settings</button>

    <span id="status">Connect: python3 font-picker.py</span>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-tabs" id="settings-tabs">
      <button class="settings-tab active" data-pane="window">Window</button>
      <button class="settings-tab" data-pane="cursor">Cursor &amp; Bell</button>
      <button class="settings-tab" data-pane="tabbar">Tab Bar</button>
      <button class="settings-tab" data-pane="scheme">Color Scheme</button>
      <button class="settings-tab" data-pane="scrollback">Scrollback &amp; Spacing</button>
    </div>

    <div class="settings-content">
      <div class="settings-pane active" data-pane="window">
        <div class="settings-row">
          <label for="opacity">Opacity</label>
          <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="1">
          <span class="val" id="opacity-val">1.00</span>
        </div>
        <div class="settings-row">
          <label for="padding">Padding (px)</label>
          <input type="number" id="padding" min="0" max="60" step="1" value="10">
        </div>
        <div class="settings-row">
          <label for="decorations">Decorations</label>
          <select id="decorations">
            <option value="TITLE | RESIZE">Title + Resize</option>
            <option value="RESIZE">Resize only</option>
            <option value="TITLE">Title only</option>
            <option value="NONE">Borderless</option>
          </select>
        </div>
      </div>

      <div class="settings-pane" data-pane="cursor">
        <div class="settings-row">
          <label for="cursor-style">Style</label>
          <select id="cursor-style">
            <option value="SteadyBlock">Steady Block</option>
            <option value="BlinkingBlock">Blinking Block</option>
            <option value="SteadyUnderline">Steady Underline</option>
            <option value="BlinkingUnderline">Blinking Underline</option>
            <option value="SteadyBar">Steady Bar</option>
            <option value="BlinkingBar">Blinking Bar</option>
          </select>
        </div>
        <div class="settings-row">
          <label for="cursor-blink">Blink rate (ms)</label>
          <input type="number" id="cursor-blink" min="0" max="2000" step="50" value="500">
        </div>
        <div class="settings-row">
          <label for="bell">Audible bell</label>
          <label class="switch"><input type="checkbox" id="bell"><span class="slider"></span></label>
        </div>
      </div>

      <div class="settings-pane" data-pane="tabbar">
        <div class="settings-row">
          <label for="hide-tab-bar">Hide if one tab</label>
          <label class="switch"><input type="checkbox" id="hide-tab-bar" data-key="hide_tab_bar_if_only_one_tab"><span class="slider"></span></label>
        </div>
        <div class="settings-row">
          <label for="fancy-tab-bar">Fancy tab bar</label>
          <label class="switch"><input type="checkbox" id="fancy-tab-bar" data-key="use_fancy_tab_bar"><span class="slider"></span></label>
        </div>
        <div class="settings-row">
          <label for="tab-bar-bottom">Tab bar at bottom</label>
          <label class="switch"><input type="checkbox" id="tab-bar-bottom" data-key="tab_bar_at_bottom"><span class="slider"></span></label>
        </div>
        <div class="settings-row">
          <label for="tab-max-width">Tab max width</label>
          <input type="number" id="tab-max-width" min="4" max="64" step="1" value="16">
        </div>
      </div>

      <div class="settings-pane" data-pane="scheme" style="max-width: 640px;">
        <div class="scheme-row">
          <input type="text" id="scheme" list="scheme-list" placeholder="Search 1,000+ schemes…">
          <datalist id="scheme-list"></datalist>
          <button id="scheme-default">Default</button>
        </div>
        <div class="scheme-quick" id="scheme-quick"></div>
      </div>

      <div class="settings-pane" data-pane="scrollback">
        <div class="settings-row">
          <label for="scrollback">Scrollback lines</label>
          <input type="number" id="scrollback" min="0" max="1000000" step="500" value="3500">
        </div>
        <div class="settings-row">
          <label for="line-height">Line height</label>
          <input type="number" id="line-height" min="0.5" max="3" step="0.05" value="1.0">
        </div>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const API = 'http://localhost:7777';

    // fonts loaded dynamically from /fonts endpoint

    const icons = "   ";

    const statusEl    = document.getElementById('status');
    const badgeEditor = document.getElementById('badge-editor');
    const badgeTab    = document.getElementById('badge-tab');
    const editorSizeEl = document.getElementById('editor-size');
    const tabSizeEl    = document.getElementById('tab-size');
    const editorWeightEl = document.getElementById('editor-weight');
    const tabWeightEl    = document.getElementById('tab-weight');
    const grid = document.getElementById('grid');

    let activeEditor = null;
    let activeTab    = null;

    /** Shorter label for badges (drops Nerd Font suffix; keeps full name otherwise). */
    function shortFamilyName(family) {
      return family.replace(/\s+Nerd Font$/, '');
    }

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = cls || '';
      if (cls) setTimeout(() => { statusEl.className = ''; statusEl.textContent = ''; }, 3000);
    }

    async function api(path) {
      try {
        const r = await fetch(API + path);
        return await r.json();
      } catch {
        setStatus('Server offline — run: python3 font-picker.py', 'err');
        return null;
      }
    }

    async function applyEditorFont(family, card, weight = null) {
      if (!weight) weight = editorWeightEl.value;
      const j = await api(`/apply?font=${encodeURIComponent(family)}&weight=${encodeURIComponent(weight)}`);
      if (!j) return;
      if (j.ok) {
        if (activeEditor) activeEditor.classList.remove('active-editor');
        activeEditor = card;
        card.classList.add('active-editor');
        badgeEditor.textContent = shortFamilyName(family);
        setStatus('✔ ' + j.msg, 'ok');
      } else setStatus(j.msg, 'err');
    }

    async function applyTabFont(family, card, weight = null) {
      if (!weight) weight = tabWeightEl.value;
      const j = await api(`/apply-tab?font=${encodeURIComponent(family)}&weight=${encodeURIComponent(weight)}`);
      if (!j) return;
      if (j.ok) {
        if (activeTab) activeTab.classList.remove('active-tab');
        activeTab = card;
        card.classList.add('active-tab');
        badgeTab.textContent = shortFamilyName(family);
        setStatus('✔ ' + j.msg, 'ok');
      } else setStatus(j.msg, 'err');
    }

    async function applyEditorWeight() {
      if (activeEditor) {
        applyEditorFont(activeEditor.dataset.family, activeEditor, editorWeightEl.value);
      }
    }

    async function applyTabWeight() {
      if (activeTab) {
        applyTabFont(activeTab.dataset.family, activeTab, tabWeightEl.value);
      }
    }

    editorWeightEl.addEventListener('change', applyEditorWeight);
    tabWeightEl.addEventListener('change', applyTabWeight);

    async function applyEditorSize(size) {
      const j = await api(`/apply-size?size=${size}`);
      if (j?.ok) setStatus('✔ ' + j.msg, 'ok');
    }

    async function applyTabSize(size) {
      const j = await api(`/apply-tab-size?size=${size}`);
      if (j?.ok) setStatus('✔ ' + j.msg, 'ok');
    }

    // Spinner helpers
    function makeSpinner(inputEl, step, applyFn) {
      return (delta) => {
        let v = parseFloat(inputEl.value) + delta * step;
        v = Math.round(v * 10) / 10;
        if (v < 6) v = 6;
        if (v > 32) v = 32;
        inputEl.value = v;
        applyFn(v);
      };
    }

    const stepEditor = makeSpinner(editorSizeEl, 0.5, applyEditorSize);
    const stepTab    = makeSpinner(tabSizeEl,    0.5, applyTabSize);

    document.getElementById('editor-dec').addEventListener('click', () => stepEditor(-1));
    document.getElementById('editor-inc').addEventListener('click', () => stepEditor(+1));
    document.getElementById('tab-dec').addEventListener('click',    () => stepTab(-1));
    document.getElementById('tab-inc').addEventListener('click',    () => stepTab(+1));

    // ── Terminal Settings panel ──
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel  = document.getElementById('settings-panel');
    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
      settingsToggle.classList.toggle('open');
    });

    document.querySelectorAll('.settings-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.settings-pane').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.querySelector(`.settings-pane[data-pane="${tab.dataset.pane}"]`).classList.add('active');
      });
    });

    const opacityEl     = document.getElementById('opacity');
    const opacityValEl  = document.getElementById('opacity-val');
    const paddingEl     = document.getElementById('padding');
    const decorationsEl = document.getElementById('decorations');
    const cursorStyleEl = document.getElementById('cursor-style');
    const cursorBlinkEl = document.getElementById('cursor-blink');
    const bellEl        = document.getElementById('bell');
    const hideTabBarEl  = document.getElementById('hide-tab-bar');
    const fancyTabBarEl = document.getElementById('fancy-tab-bar');
    const tabBarBottomEl = document.getElementById('tab-bar-bottom');
    const tabMaxWidthEl = document.getElementById('tab-max-width');
    const schemeEl      = document.getElementById('scheme');
    const schemeListEl  = document.getElementById('scheme-list');
    const schemeDefaultBtn = document.getElementById('scheme-default');
    const schemeQuickEl = document.getElementById('scheme-quick');
    const scrollbackEl  = document.getElementById('scrollback');
    const lineHeightEl  = document.getElementById('line-height');

    const QUICK_SCHEMES = [
      'Catppuccin Mocha', 'Catppuccin Macchiato', 'Dracula', 'Nord (Gogh)',
      'Tokyo Night', 'Tokyo Night Storm', 'Gruvbox Dark (Gogh)',
      'Solarized Dark - Patched', 'Monokai Remastered', 'Everforest Dark (Gogh)',
    ];

    function highlightActiveChip(name) {
      schemeQuickEl.querySelectorAll('.scheme-chip').forEach(c => {
        c.classList.toggle('active', c.textContent === name);
      });
    }

    function buildSchemeChips() {
      schemeQuickEl.innerHTML = QUICK_SCHEMES.map(s => `<button class="scheme-chip">${s}</button>`).join('');
      schemeQuickEl.querySelectorAll('.scheme-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          schemeEl.value = chip.textContent;
          highlightActiveChip(chip.textContent);
          applyAndStatus(`/apply-scheme?name=${encodeURIComponent(chip.textContent)}`);
        });
      });
    }
    buildSchemeChips();

    async function applyAndStatus(path) {
      const j = await api(path);
      if (j?.ok) setStatus('✔ ' + j.msg, 'ok');
      else if (j) setStatus(j.msg, 'err');
    }

    opacityEl.addEventListener('input', () => { opacityValEl.textContent = parseFloat(opacityEl.value).toFixed(2); });
    opacityEl.addEventListener('change', () => applyAndStatus(`/apply-opacity?value=${opacityEl.value}`));
    paddingEl.addEventListener('change', () => applyAndStatus(`/apply-padding?value=${paddingEl.value}`));
    decorationsEl.addEventListener('change', () => applyAndStatus(`/apply-decorations?value=${encodeURIComponent(decorationsEl.value)}`));
    cursorStyleEl.addEventListener('change', () => applyAndStatus(`/apply-cursor-style?value=${encodeURIComponent(cursorStyleEl.value)}`));
    cursorBlinkEl.addEventListener('change', () => applyAndStatus(`/apply-cursor-blink?value=${cursorBlinkEl.value}`));
    bellEl.addEventListener('change', () => applyAndStatus(`/apply-bell?enabled=${bellEl.checked ? 1 : 0}`));
    tabMaxWidthEl.addEventListener('change', () => applyAndStatus(`/apply-tab-max-width?value=${tabMaxWidthEl.value}`));
    scrollbackEl.addEventListener('change', () => applyAndStatus(`/apply-scrollback?value=${scrollbackEl.value}`));
    lineHeightEl.addEventListener('change', () => applyAndStatus(`/apply-line-height?value=${lineHeightEl.value}`));

    [hideTabBarEl, fancyTabBarEl, tabBarBottomEl].forEach(el => {
      el.addEventListener('change', () => applyAndStatus(`/apply-tab-toggle?key=${el.dataset.key}&value=${el.checked ? 1 : 0}`));
    });

    schemeEl.addEventListener('change', () => {
      if (schemeEl.value) {
        highlightActiveChip(schemeEl.value);
        applyAndStatus(`/apply-scheme?name=${encodeURIComponent(schemeEl.value)}`);
      }
    });
    schemeDefaultBtn.addEventListener('click', () => {
      schemeEl.value = '';
      highlightActiveChip('');
      applyAndStatus('/apply-scheme?name=');
    });

    async function loadSchemes() {
      const schemes = await api('/schemes');
      if (!schemes) return;
      schemeListEl.innerHTML = schemes.map(s => `<option value="${s}"></option>`).join('');
    }

    // Build cards from font list
    const cardMap = {};
    function buildGrid(fonts) {
      grid.innerHTML = '';
      Object.keys(cardMap).forEach(k => delete cardMap[k]);
      if (!fonts.length) {
        grid.innerHTML = '<p style="color:var(--subtext);padding:2rem">No monospace fonts found — install fonts (e.g. module 04), run <code style="color:var(--accent)">fc-cache -fv</code>, refresh.</p>';
        return;
      }
      fonts.forEach(f => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.family = f.family;
        card.innerHTML = `
          <div class="card-header">
            <span class="font-name">${f.name}</span>
            <div class="badges">
              <span class="badge badge-editor">EDITOR</span>
              <span class="badge badge-tab">TABS</span>
              <span class="font-tag">${f.desc}</span>
            </div>
          </div>
          <div class="sample" style="font-family:'${f.family}',monospace">${f.text}</div>
          <div class="code-line" style="font-family:'${f.family}',monospace">
            const greet = (name) =&gt; \`Hello, <span style="color:#cba6f7">\${name}</span>!\`; // 0Oo1lI
          </div>
          <div class="icons" style="font-family:'${f.family}',monospace">${icons}</div>
          <div class="card-actions">
            <button class="act-btn editor">Editor</button>
            <button class="act-btn tab">Tabs</button>
          </div>
        `;
        card.querySelector('.act-btn.editor').addEventListener('click', e => { e.stopPropagation(); applyEditorFont(f.family, card); });
        card.querySelector('.act-btn.tab').addEventListener('click',    e => { e.stopPropagation(); applyTabFont(f.family, card); });
        card.addEventListener('click', () => applyEditorFont(f.family, card));
        grid.appendChild(card);
        cardMap[f.family] = card;
      });
    }

    // Load current state and highlight active cards
    async function loadCurrent() {
      const j = await api('/current');
      if (!j) return;
      if (j.font && cardMap[j.font]) {
        activeEditor = cardMap[j.font];
        activeEditor.classList.add('active-editor');
        badgeEditor.textContent = shortFamilyName(j.font);
      }
      if (j.tabFont && cardMap[j.tabFont]) {
        activeTab = cardMap[j.tabFont];
        activeTab.classList.add('active-tab');
        badgeTab.textContent = shortFamilyName(j.tabFont);
      }
      if (j.size)    editorSizeEl.value = j.size;
      if (j.tabSize) tabSizeEl.value    = j.tabSize;
      if (j.weight)    editorWeightEl.value = j.weight;
      if (j.tabWeight) tabWeightEl.value    = j.tabWeight;

      if (j.opacity != null) { opacityEl.value = j.opacity; opacityValEl.textContent = parseFloat(j.opacity).toFixed(2); }
      if (j.padding !== '')  paddingEl.value = j.padding;
      if (j.decorations)     decorationsEl.value = j.decorations;
      if (j.cursorStyle)     cursorStyleEl.value = j.cursorStyle;
      if (j.cursorBlink != null) cursorBlinkEl.value = j.cursorBlink;
      bellEl.checked = j.bell === 'SystemBeep';
      hideTabBarEl.checked   = !!j.hideTabBarIfOnlyOneTab;
      fancyTabBarEl.checked  = !!j.useFancyTabBar;
      tabBarBottomEl.checked = !!j.tabBarAtBottom;
      if (j.tabMaxWidth != null) tabMaxWidthEl.value = j.tabMaxWidth;
      if (j.scrollback != null)  scrollbackEl.value  = j.scrollback;
      if (j.lineHeight != null)  lineHeightEl.value  = j.lineHeight;
      schemeEl.value = j.colorScheme || '';
      highlightActiveChip(j.colorScheme || '');

      statusEl.textContent = 'Ready';
    }

    // Boot: fetch font list, build grid, then highlight current
    async function init() {
      setStatus('Loading fonts…');
      const fonts = await api('/fonts');
      if (!fonts) return;
      buildGrid(fonts);
      setStatus(`${fonts.length} font${fonts.length !== 1 ? 's' : ''} found`, 'ok');
      loadSchemes();
      await loadCurrent();
    }

    init();
  </script>
</body>
</html>
